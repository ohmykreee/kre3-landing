name: Lint & Deploy

on:
  push:
  workflow_dispatch:
    inputs:
      lint_only:
        description: 'Do lint only (no deploy)'
        required: true
        type: boolean
        default: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@master

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Prepare workspace
        run: pnpm ci --ignore-scripts

      - name: Clone config file from Repo
        run: |
          if [ -n "${{ secrets.PRIVATE_SSH_KEY }}" ]; then
            eval `ssh-agent -s`
            echo "${{ secrets.PRIVATE_SSH_KEY }}" | ssh-add -
          else
            echo "SSH Key is empty, skipping ssh-add..."
          fi
          git clone ${{ secrets.CONFIG_REPO_URL }} src/lib/config/default
        continue-on-error: true

      - name: Project check
        run: pnpm prepare && pnpm lint

      - name: Build project
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        if: >-
          success() && 
          (
            github.ref == 'refs/heads/main' || 
            (github.event_name == 'workflow_dispatch' && inputs.lint_only == false)
          )
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch main
